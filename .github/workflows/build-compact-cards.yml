name: Test compact lesson cards
on:
  push:
    branches:
      - feature/compact-lesson-cards
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: node scripts/build-shared.mjs
      - name: Compile standalone GitHub Pages UI
        run: |
          cp shared-dist/index.html index.html
          git add index.html
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Build compact agenda UI [skip ci]"
            git push
          fi
