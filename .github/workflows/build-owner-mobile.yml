name: Validate owner backups and responsive Orbita
on:
  push:
    branches: [feature/owner-backup-mobile]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Automated security and regression tests
        run: npm test
      - name: Compile connected GitHub Pages and Supabase function
        run: node scripts/build-shared.mjs
      - name: Stage artifacts
        run: |
          cp shared-dist/index.html index.html
          git add index.html supabase/functions/calendar-api/index.ts
      - name: Commit validated build to feature branch
        run: |
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Build owner backup and mobile UI [skip ci]'
            git push
          fi
