name: Check owner maintenance source
on:
  push:
    branches:
      - feature/owner-maintenance-review
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: node scripts/build-shared.mjs
      - name: Update built files
        run: |
          cp shared-dist/index.html index.html
          git add index.html supabase/functions/calendar-api/index.ts
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Build owner review package [skip ci]"
            git push
          fi
